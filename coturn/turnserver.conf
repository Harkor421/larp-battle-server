# coturn config for Larp Battle — /etc/turnserver.conf
# Pairs with the app's TURN_SECRET (server/config.js) via the REST credential
# mechanism: the app hands out time-limited HMAC credentials, no user database.

# ---- Identity ----
realm=turn.YOURDOMAIN.com
server-name=turn.YOURDOMAIN.com

# ---- Listening ----
listening-port=3478
tls-listening-port=5349
# Set to the server's public IP (Hetzner dedicated: the primary IP)
# listening-ip=YOUR.SERVER.IP
# external-ip=YOUR.SERVER.IP

# ---- Relay port range (open in firewall) ----
min-port=49152
max-port=65535

# ---- Auth: time-limited credentials (MUST match TURN_SECRET in the app .env) ----
use-auth-secret
static-auth-secret=CHANGE_ME_LONG_RANDOM_SECRET

# ---- TLS (after certbot: certonly --standalone -d turn.YOURDOMAIN.com) ----
# cert=/etc/letsencrypt/live/turn.YOURDOMAIN.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.YOURDOMAIN.com/privkey.pem

# ---- Hardening ----
fingerprint
no-multicast-peers
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780
# Block relaying into private networks
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Quotas — tune with real traffic. 0 = unlimited.
user-quota=12
total-quota=1200
# Per-allocation bandwidth cap in bytes/sec (0 = unlimited). ~2.5 Mbps:
max-bps=320000

# ---- Logging ----
log-file=/var/log/turnserver.log
simple-log
